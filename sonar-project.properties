# SonarQube - EPSI HL / Sistema IRIS
# Fuentes: backend usa routes/, validators/, services/ (no rutas/ ni servicios/)
sonar.sources=backend/src,frontend/vite-project/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.min.js
# Coverage: ejecutar npm run test:coverage en backend y frontend antes de sonar-scanner
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/vite-project/coverage/lcov.info

# Las reglas ya están corregidas en routes/, services/
# Si SonarQube muestra rutas/ o servicios/, verifica: sonar-scanner usa estas rutas
