services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: epsi_hl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/epsi_hl
      PGSSL: 0
      JWT_SECRET: super-secret
      ADMIN_DEFAULT_PASSWORD: Admin123!
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY: 0
      PDF_OUTPUT_DIR: /app/remisiones-pdf
      CLIENTES_CSV_PATH: ""
    ports:
      - "3001:3001"
    volumes:
      - backend_pdfs:/app/remisiones-pdf

volumes:
  postgres_data:
  backend_pdfs:
